# TEMPORARY: prints game class signatures for a session that can't download the game. Removed before merge.
name: API dump
on:
  push:
    branches: [claude/project-thread-fw4m4w]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileClientJava --no-daemon -q || true
      - name: javap
        run: |
          CP=$(find .gradle/loom-cache ~/.gradle -name 'minecraft-*26.3*.jar' 2>/dev/null | grep -v sources | tr '\n' ':')
          echo "CP=$CP"
          while read -r c; do
            [ -z "$c" ] && continue
            echo "=================== $c"
            javap -p -cp "$CP" "$c" 2>&1 | grep -v 'lambda\$' | head -400
          done < .github/api-classes.txt
